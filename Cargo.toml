[package]
name = "verilog-ide"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Desktop IDE for Verilog HDL and testbenches"
license = "MIT"
authors = ["Verilog IDE"]

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
