[package]
name = "verilog-ide"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Desktop IDE for Verilog HDL and testbenches"
license = "MIT"
authors = ["Verilog IDE"]

[dependencies]
anyhow = "1"
iced = { version = "0.13.1", default-features = false, features = [
    "tiny-skia",
    "fira-sans",
    "tokio",
    "advanced",
    "highlighter",
] }
rfd = { version = "0.15", default-features = false, features = ["tokio", "gtk3"] }
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
