[package]
name = "verilog-ide"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Desktop IDE for Verilog HDL and testbenches"
license = "MIT"
authors = ["Verilog IDE"]

[dependencies]
anyhow = "1"
# Vendored at vendor/xezim (https://github.com/aionhw/xezim @ 265595e6).
xezim = { path = "vendor/xezim" }
# Wellen is the VCD/FST/GHW engine used by Surfer
# (vendored at vendor/surfer, https://gitlab.com/surfer-project/surfer @ v0.7.0).
wellen = { version = "0.25", default-features = false }
iced = { version = "0.13.1", default-features = false, features = [
    "tiny-skia",
    "fira-sans",
    "tokio",
    "advanced",
    "highlighter",
] }
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# xezim's Cargo.toml still names the git URL; point it at the vendored core
# so `cargo build` does not fetch GitHub.
[patch."https://github.com/aionhw/xezim-core.git"]
xezim-core = { path = "vendor/xezim-core" }
sv-parser = { path = "vendor/xezim-core/xezim-parser" }
