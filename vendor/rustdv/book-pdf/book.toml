[book]
title = "Rust for RTL Verification"
authors = ["Ray Salemi"]
language = "en"
description = "A complete course in Rust and rustdv"

[output.html]
additional-css = ["github-markdown.css"]


[output.pdf]
# Skipped rather than fatal where `mdbook-pdf` is absent: it needs a Chromium,
# which the sandbox VM does not have, so `mdbook build book-pdf` there would
# fail on the PDF backend after having written the HTML perfectly well. With
# this, the VM gets its structural check and Ray's Mac still renders the PDF.
optional = true
print-background = true
display-header-footer = true
footer-template = "<div style='font-size:9px; width:100%; text-align:center; color:#555;'><span class='pageNumber'></span> / <span class='totalPages'></span></div>"
header-template = "<span></span>"
margin-bottom = 0.7

